<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>打開捷徑</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:-apple-system,"PingFang TC",sans-serif;background:#f6f4ef;color:#2b2b2b}
  a{display:inline-block;padding:16px 28px;border-radius:12px;background:#8fa8bf;color:#fff;
    text-decoration:none;font-size:18px}
  p{color:#7a7a7a;font-size:14px;margin-top:16px}
  main{text-align:center;padding:16px}
</style>
</head>
<body>
<main>
  <a id="go" href="#">👉 打開捷徑</a>
  <p id="hint">如果沒有自動跳轉，請點上面的按鈕</p>
</main>
<script>
  // ?name= 指定要執行的捷徑名稱，預設「習慣打卡」
  var name = new URLSearchParams(location.search).get('name') || '習慣打卡';
  var url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(name);
  document.getElementById('go').href = url;
  document.getElementById('go').textContent = '👉 打開「' + name + '」';
  location.href = url;
</script>
</body>
</html>
